name: Windows 11 Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Melody kaynak kodunu al
        uses: actions/checkout@v4
        with:
          repository: Arise1881/melody
          ref: main

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bagimliliklar
        run: flutter pub get

      - name: Analiz
        run: flutter analyze

      - name: Windows release derle
        run: flutter build windows --release

      - name: ZIP paketle
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Melody-windows.zip -Force

      - name: GitHub release'e yukle (bu repo)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: Arise1881/melody-dist
          TAG: melody-latest
        shell: pwsh
        run: |
          $Headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json"; "X-GitHub-Api-Version" = "2022-11-28" }
          $Release = Invoke-RestMethod -Method Get -Headers $Headers -Uri "https://api.github.com/repos/$env:REPO/releases/tags/$env:TAG"
          $UploadHeaders = @{ Authorization = "Bearer $env:GH_TOKEN"; "Content-Type" = "application/zip"; "X-GitHub-Api-Version" = "2022-11-28" }
          $UploadUri = "https://uploads.github.com/repos/$($env:REPO)/releases/$($Release.id)/assets?name=Melody-windows.zip"
          Invoke-RestMethod -Method Post -Headers $UploadHeaders -InFile "Melody-windows.zip" -Uri $UploadUri | Out-Null
          Write-Host "Melody-windows.zip -> melody-dist release eklendi"